name: Build and deploy site

# Runs after every Save in Pages CMS (and any push to main):
# converts new uploads and rebuilds the HTML from content/*.json. Its commit then publishes via GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow
      - name: Build
        run: python3 build.py
      - name: Save generated files back to the repo
        run: |
          git config user.name "site-builder"
          git config user.email "site-builder@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild site [skip ci]"
            git push
          fi
